<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Jotter – AI meeting notes</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <button id="back" class="icon hidden" aria-label="Back">‹</button>
  <h1 id="title">Jotter</h1>
  <span id="who" class="pill hidden"></span>
  <span id="spend" class="pill hidden"></span>
  <button id="logout" class="icon hidden" aria-label="Sign out" title="Sign out">⎋</button>
</header>

<main id="login" class="hidden">
  <form id="loginForm">
    <h2>Sign in</h2>
    <input id="lUser" placeholder="Username" autocomplete="username" autocapitalize="none" required>
    <input id="lPass" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
    <p id="lErr" class="muted"></p>
  </form>
</main>

<main id="list" class="hidden">
  <div id="notes"></div>
  <p id="empty" class="muted">No meetings yet. Tap the mic to record one – no typing needed.</p>
</main>

<main id="editor" class="hidden">
  <h2 id="mtitle"></h2>
  <div class="tabs">
    <button data-tab="summary" class="on">Summary</button>
    <button data-tab="transcript">Transcript</button>
  </div>
  <div id="tSummary" class="out"></div>
  <div id="tTranscript" class="out hidden"></div>
  <div class="bar">
    <button id="rec" class="rec">● Record</button>
    <button id="retry">Retry</button>
    <button id="copy">Copy</button>
    <button id="del" class="danger">Delete</button>
  </div>
  <p id="status" class="muted"></p>
</main>

<button id="fab" class="hidden" aria-label="New recording">🎙</button>
<script src="app.js"></script>
</body>
</html>
